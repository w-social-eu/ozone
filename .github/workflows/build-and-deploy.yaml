name: Build & Deploy Ozone UI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'stage'
        type: choice
        options:
          - stage
          - prod

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/w-social-eu/ozone

jobs:
  # Kanban Delivery Flow, stage rule: main only takes a merged pull request from a
  # feature/<name> branch that already contained main. Anything else is not built or deployed.
  # Tags (prod) and manual runs are not checked here.
  stage-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Stage rules
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/$1"; }
          PRS=$(api "commits/${GITHUB_SHA}/pulls")
          PICK='[.[] | select(.merged_at != null and .base.ref == strenv(GITHUB_REF_NAME))] | .[0]'
          NUM=$(echo "$PRS" | yq -p json "$PICK | .number // \"\"")
          if [ -z "$NUM" ]; then
            echo "::error::${GITHUB_SHA::12} reached $GITHUB_REF_NAME without a merged pull request. Stage only takes pull requests from feature/<name> branches; nothing is deployed."
            exit 1
          fi
          HEAD_REF=$(echo "$PRS" | yq -p json "$PICK | .head.ref")
          HEAD_SHA=$(echo "$PRS" | yq -p json "$PICK | .head.sha")
          case "$HEAD_REF" in
            feature/?*) ;;
            *) echo "::error::PR #$NUM came from '$HEAD_REF'. Stage only takes pull requests from feature/<name> branches; nothing is deployed."; exit 1 ;;
          esac
          BEHIND=$(api "compare/${BEFORE}...${HEAD_SHA}" | yq -p json '.behind_by')
          if [ "$BEHIND" != "0" ]; then
            echo "::error::PR #$NUM ($HEAD_REF) was merged while $BEHIND commit(s) behind $GITHUB_REF_NAME. A feature branch must contain the latest $GITHUB_REF_NAME before it is merged; nothing is deployed."
            exit 1
          fi
          echo "PR #$NUM from $HEAD_REF, contained $GITHUB_REF_NAME at merge time"

  build-and-deploy:
    needs: stage-rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Determine environment
        id: config
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" == v* ]]; then
            ENV="prod"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            ENV="stage"
          else
            # dev, dev2 and dev3 are deployed by hand with the Deploy feature workflow.
            echo "::error::${{ github.ref_name }} does not deploy anywhere: main -> stage, v* tag -> prod"; exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${ENV}-${SHORT_SHA}"
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

          case "$ENV" in
            stage) echo "kubeconfig_secret=KUBECONFIG_STAGE" >> $GITHUB_OUTPUT ;;
            prod)  echo "kubeconfig_secret=KUBECONFIG_PROD" >> $GITHUB_OUTPUT ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.config.outputs.image_tag }}
            ${{ env.IMAGE }}:${{ steps.config.outputs.environment }}-latest
          no-cache: true

      - name: Checkout infrastructure
        uses: actions/checkout@v4
        with:
          repository: w-social-eu/w-social-infrastructure
          token: ${{ secrets.PAT_TOKEN }}
          path: infrastructure

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets[steps.config.outputs.kubeconfig_secret] }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy Ozone UI
        run: |
          ENV="${{ steps.config.outputs.environment }}"
          TAG="${{ steps.config.outputs.image_tag }}"
          CHART="infrastructure/fleet/bundles/ozone-ui"

          helm upgrade --install ozone-ui "$CHART" \
            -f "$CHART/values.yaml" \
            -f "$CHART/values-${ENV}.yaml" \
            --set image.tag="${TAG}" \
            -n ozone \
            --wait --timeout 5m

      - name: Summary
        if: always()
        run: |
          echo "## Ozone UI Build & Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | **${{ steps.config.outputs.environment }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ steps.config.outputs.short_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker image | \`${{ env.IMAGE }}:${{ steps.config.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | \`helm upgrade\` to \`${{ steps.config.outputs.environment }}\` cluster |" >> $GITHUB_STEP_SUMMARY
