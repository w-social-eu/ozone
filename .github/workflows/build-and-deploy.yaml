name: Build & Deploy Ozone UI

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - stage
          - prod

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/w-social-eu/ozone

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Determine environment
        id: config
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" == v* ]]; then
            ENV="prod"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            ENV="stage"
          elif [[ "${{ github.ref_name }}" == "develop" || "${{ github.ref_name }}" == feature/* ]]; then
            ENV="dev"
          else
            ENV="dev"
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${ENV}-${SHORT_SHA}"
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.config.outputs.image_tag }}
            ${{ env.IMAGE }}:${{ steps.config.outputs.environment }}-latest
          no-cache: true

      # Deliver via GitOps: write the tag to argocd/images/ozone-ui-<env>.yaml in
      # w-social-infrastructure and the ozone-ui-<env> ArgoCD app converges. Other
      # services bump their own files in the same repo, so rebase and retry on a
      # rejected push. No kubeconfig or helm here.
      - name: Bump image tag in infrastructure (GitOps)
        run: |
          set -euo pipefail
          ENV="${{ steps.config.outputs.environment }}"
          TAG="${{ steps.config.outputs.image_tag }}"
          git clone "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/w-social-eu/w-social-infrastructure.git" infra
          cd infra
          VF="argocd/images/ozone-ui-${ENV}.yaml"
          if ! grep -qE '^\s*tag:' "$VF"; then
            echo "::error::$VF has no tag: line to update"; exit 1
          fi
          sed -i -E "s|^(\s*tag:).*|\1 ${TAG}|" "$VF"
          git config user.name  "ci-bot"
          git config user.email "ci@wsocial.eu"
          git add "$VF"
          git commit -m "ozone-ui ${ENV}: image ${TAG}" || { echo "no change"; exit 0; }
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing (attempt $i)"
            git fetch origin main && git rebase origin/main
          done
          echo "::error::could not push the tag bump after 5 attempts"; exit 1

      - name: Summary
        if: always()
        run: |
          echo "## Ozone UI Build & Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | **${{ steps.config.outputs.environment }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ steps.config.outputs.short_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker image | \`${{ env.IMAGE }}:${{ steps.config.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | GitOps: ArgoCD app \`ozone-ui-${{ steps.config.outputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
