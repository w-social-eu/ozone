name: Build & Deploy Ozone UI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'stage'
        type: choice
        options:
          - stage
          - prod

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/w-social-eu/ozone

jobs:
  # Kanban Delivery Flow, stage rule: main only takes a merged pull request from a
  # feature/<name> branch that already contained main. Anything else is not built or deployed.
  # The pull request must also be approved by someone other than its author, and its own CI
  # must have finished without a failure. GitHub Free cannot lock the merge button on a private
  # repository, so this job is the lock: such a merge lands on main but is not deployed.
  # Tags (prod) and manual runs are not checked here.
  stage-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read   # the pull request's own CI runs
    steps:
      - name: Stage rules
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/$1"; }
          PICK='[.[] | select(.merged_at != null and .base.ref == strenv(GITHUB_REF_NAME))] | .[0]'
          # GitHub links a merge commit to its pull request a few seconds after the merge;
          # asking straight away can return nothing. Retry for about a minute before deciding.
          NUM=""
          for attempt in 1 2 3 4 5 6 7; do
            PRS=$(api "commits/${GITHUB_SHA}/pulls")
            NUM=$(echo "$PRS" | yq -p json "$PICK | .number // \"\"")
            [ -n "$NUM" ] && break
            sleep 10
          done
          if [ -z "$NUM" ]; then
            echo "::error::${GITHUB_SHA::12} reached $GITHUB_REF_NAME without a merged pull request. Stage only takes pull requests from feature/<name> branches; nothing is deployed."
            exit 1
          fi
          HEAD_REF=$(echo "$PRS" | yq -p json "$PICK | .head.ref")
          HEAD_SHA=$(echo "$PRS" | yq -p json "$PICK | .head.sha")
          case "$HEAD_REF" in
            feature/?*) ;;
            *) echo "::error::PR #$NUM came from '$HEAD_REF'. Stage only takes pull requests from feature/<name> branches; nothing is deployed."; exit 1 ;;
          esac
          BEHIND=$(api "compare/${BEFORE}...${HEAD_SHA}" | yq -p json '.behind_by')
          if [ "$BEHIND" != "0" ]; then
            echo "::error::PR #$NUM ($HEAD_REF) was merged while $BEHIND commit(s) behind $GITHUB_REF_NAME. A feature branch must contain the latest $GITHUB_REF_NAME before it is merged; nothing is deployed."
            exit 1
          fi
          AUTHOR=$(echo "$PRS" | yq -p json "$PICK | .user.login")
          VERDICTS=$(api "pulls/${NUM}/reviews?per_page=100" | AUTHOR="$AUTHOR" yq -p json -o json '[.[] | select(.user.login != strenv(AUTHOR)) | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")] | group_by(.user.login) | map(.[-1].state)')
          if [ "$(echo "$VERDICTS" | yq -p json 'map(select(. == "CHANGES_REQUESTED")) | length')" != "0" ]; then
            echo "::error::PR #$NUM was merged while a reviewer had requested changes; nothing is deployed."
            exit 1
          fi
          if [ "$(echo "$VERDICTS" | yq -p json 'map(select(. == "APPROVED")) | length')" = "0" ]; then
            echo "::error::PR #$NUM was merged without an approval. A pull request needs 1 approval from someone other than its author ($AUTHOR) before it is merged; nothing is deployed."
            exit 1
          fi
          # The pull request's own CI on its last commit: nothing failed, nothing still running.
          RUNS=$(api "actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100")
          FAILED=$(echo "$RUNS" | yq -p json '[.workflow_runs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name] | unique | join(", ")')
          RUNNING=$(echo "$RUNS" | yq -p json '[.workflow_runs[] | select(.status != "completed") | .name] | unique | join(", ")')
          if [ -n "$FAILED" ]; then
            echo "::error::PR #$NUM was merged with failing CI ($FAILED); nothing is deployed."
            exit 1
          fi
          if [ -n "$RUNNING" ]; then
            echo "::error::PR #$NUM was merged before its CI finished ($RUNNING); nothing is deployed."
            exit 1
          fi
          echo "PR #$NUM from $HEAD_REF: approved, CI green, contained $GITHUB_REF_NAME at merge time"

  build-and-deploy:
    needs: stage-rules
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Determine environment
        id: config
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" == v* ]]; then
            ENV="prod"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            ENV="stage"
          else
            # dev, dev2 and dev3 are deployed by hand with the Deploy feature workflow.
            echo "::error::${{ github.ref_name }} does not deploy anywhere: main -> stage, v* tag -> prod"; exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "$ENV" = "prod" ]; then
            # prod only ever ships a release tag; the image tag IS the git tag.
            if [[ "${{ github.ref_type }}" != "tag" ]]; then
              echo "::error::prod deploys only from a v* tag"; exit 1
            fi
            IMAGE_TAG="${{ github.ref_name }}"
          else
            IMAGE_TAG="${ENV}-${SHORT_SHA}"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.config.outputs.image_tag }}
            ${{ env.IMAGE }}:${{ steps.config.outputs.environment }}-latest
          no-cache: true

      # Deliver via GitOps: write the tag to argocd/images/ozone-ui-<env>.yaml in
      # w-social-infrastructure and the ozone-ui-<env> ArgoCD app converges. Other
      # services bump their own files in the same repo, so rebase and retry on a
      # rejected push. No kubeconfig or helm here: ArgoCD owns the release, and a
      # helm upgrade from CI fails on the objects it already manages.
      - name: Bump image tag in infrastructure (GitOps)
        run: |
          set -euo pipefail
          ENV="${{ steps.config.outputs.environment }}"
          TAG="${{ steps.config.outputs.image_tag }}"
          git clone --depth 1 "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/w-social-eu/w-social-infrastructure.git" infra
          cd infra
          VF="argocd/images/ozone-ui-${ENV}.yaml"
          if ! grep -qE '^\s*tag:' "$VF"; then
            echo "::error::$VF has no tag: line to update"; exit 1
          fi
          sed -i -E "s|^(\s*tag:).*|\1 ${TAG}|" "$VF"
          git config user.name  "ci-bot"
          git config user.email "ci@wsocial.eu"
          git add "$VF"
          git commit -m "ozone-ui ${ENV}: image ${TAG}" || { echo "no change"; exit 0; }
          for attempt in 1 2 3 4 5 6; do
            git push && exit 0
            echo "push raced another commit, retrying ($attempt)"; sleep $((attempt * 3))
            git pull --rebase
          done
          echo "::error::could not push to the infra repo after 6 attempts"; exit 1

      - name: Summary
        if: always()
        run: |
          echo "## Ozone UI Build & Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | **${{ steps.config.outputs.environment }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ steps.config.outputs.short_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker image | \`${{ env.IMAGE }}:${{ steps.config.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | GitOps: ArgoCD app \`ozone-ui-${{ steps.config.outputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
