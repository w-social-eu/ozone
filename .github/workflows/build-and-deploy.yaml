name: Build & Deploy Ozone UI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'stage'
        type: choice
        options:
          - stage
          - prod

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/w-social-eu/ozone

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Determine environment
        id: config
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" == v* ]]; then
            ENV="prod"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            ENV="stage"
          else
            # dev, dev2 and dev3 are deployed by hand with the Deploy feature workflow.
            echo "::error::${{ github.ref_name }} does not deploy anywhere: main -> stage, v* tag -> prod"; exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${ENV}-${SHORT_SHA}"
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

          case "$ENV" in
            stage) echo "kubeconfig_secret=KUBECONFIG_STAGE" >> $GITHUB_OUTPUT ;;
            prod)  echo "kubeconfig_secret=KUBECONFIG_PROD" >> $GITHUB_OUTPUT ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.config.outputs.image_tag }}
            ${{ env.IMAGE }}:${{ steps.config.outputs.environment }}-latest
          no-cache: true

      - name: Checkout infrastructure
        uses: actions/checkout@v4
        with:
          repository: w-social-eu/w-social-infrastructure
          token: ${{ secrets.PAT_TOKEN }}
          path: infrastructure

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets[steps.config.outputs.kubeconfig_secret] }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy Ozone UI
        run: |
          ENV="${{ steps.config.outputs.environment }}"
          TAG="${{ steps.config.outputs.image_tag }}"
          CHART="infrastructure/fleet/bundles/ozone-ui"

          helm upgrade --install ozone-ui "$CHART" \
            -f "$CHART/values.yaml" \
            -f "$CHART/values-${ENV}.yaml" \
            --set image.tag="${TAG}" \
            -n ozone \
            --wait --timeout 5m

      - name: Summary
        if: always()
        run: |
          echo "## Ozone UI Build & Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | **${{ steps.config.outputs.environment }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ steps.config.outputs.short_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker image | \`${{ env.IMAGE }}:${{ steps.config.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | \`helm upgrade\` to \`${{ steps.config.outputs.environment }}\` cluster |" >> $GITHUB_STEP_SUMMARY
