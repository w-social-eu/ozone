name: Cypress Tests

on:
  pull_request:
  push:
    branches:
      - main

env:
  NEXT_PUBLIC_OZONE_SERVICE_DID: did:plc:ar7c4by46qjdydhdevvrndac
  NEXT_PUBLIC_PLC_DIRECTORY_URL: https://plc.directory
  NEXT_PUBLIC_HANDLE_RESOLVER_URL: https://api.bsky.app

jobs:
  cypress-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            **/node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        run: yarn install

      - name: Build application
        run: yarn build

      # Run E2E tests
      - name: Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          install: false # Skip installation as we've already done it
          start: yarn start # Start the app server
          browser: chrome
          # 127.0.0.1, not localhost: on current Node localhost resolves to ::1 first,
          # the server listens on IPv4, and the wait ended with "Socket closed before the
          # connection was established" (red since 2026-09-29).
          wait-on: 'http://127.0.0.1:3000'

      # Run Component tests
      - name: Cypress Component Tests
        uses: cypress-io/github-action@v6
        with:
          install: false # Skip installation again
          component: true # Run component tests
          browser: chrome

      # Upload screenshots if either test type fails
      - name: Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore