name: Cypress Tests

on:
  pull_request:
  push:
    branches:
      - main

env:
  NEXT_PUBLIC_OZONE_SERVICE_DID: did:plc:ar7c4by46qjdydhdevvrndac
  NEXT_PUBLIC_PLC_DIRECTORY_URL: https://plc.directory
  NEXT_PUBLIC_HANDLE_RESOLVER_URL: https://api.bsky.app

jobs:
  cypress-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            **/node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        run: yarn install

      - name: Build application
        run: yarn build

      # Started here rather than by the Cypress action: when the action started it, the
      # job ended with "Socket closed before the connection was established" and no word
      # from the app itself (red since 2026-09-29). This way the app's own log is shown.
      - name: Start the app
        run: |
          yarn start > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sS -o /dev/null http://127.0.0.1:3000; then echo "app is up"; exit 0; fi
            sleep 2
          done
          echo "::error::the app did not answer on 127.0.0.1:3000 within 2 minutes"
          cat app.log
          exit 1

      # Run E2E tests
      - name: Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          install: false # Skip installation as we've already done it
          browser: chrome

      - name: App log
        if: failure()
        run: tail -100 app.log || true

      # Run Component tests
      - name: Cypress Component Tests
        uses: cypress-io/github-action@v6
        with:
          install: false # Skip installation again
          component: true # Run component tests
          browser: chrome

      # Upload screenshots if either test type fails
      - name: Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore